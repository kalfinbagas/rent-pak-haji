# Mosquitto MQTT Broker Config — Rent Pak Haji

# TCP listener (untuk ESP32 / IoT devices)
listener 1883
allow_anonymous true

# WebSocket listener (untuk NestJS IoT Gateway)
listener 9001
protocol websockets
allow_anonymous true

# Logging
log_type error
log_type warning
log_type notice
log_type information

# Persistence
persistence true
persistence_location /mosquitto/data/
